<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Usuario: {{ usuario.nombre }}</h1>
    <h2>Favoritos</h2>
    <table>
        <tr>
            <th>Canción</th>
            <th>Artista</th>
        </tr>
        {% for cancion in favoritos %}
        <tr>
            <td>{{ cancion.nombre }}</td>
            <td>{{ cancion.artista }}</td>
        </tr>
        {% endfor %}
    </table>
    
</body>
</html>
